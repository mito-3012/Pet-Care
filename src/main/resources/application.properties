# ===============================
# CONFIGURACIÓN DEL SERVIDOR
# ===============================
# Define explícitamente el puerto para asegurar que coincida con lo que espera tu frontend
server.port=8080

# ===============================
# BASE DE DATOS H2 (En memoria)
# ===============================
# DB_CLOSE_DELAY=-1 evita que la base de datos se borre si pierde momentáneamente la conexión
spring.datasource.url=jdbc:h2:mem:veterinaria_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# HIBERNATE & JPA
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Formatea el SQL en la consola para que sea legible y no una sola línea gigante
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONSOLA H2
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# CONFIGURACIÓN JSON PARA LA API
# ===============================
# No envía campos nulos a tu frontend en React (ahorra ancho de banda y previene errores)
spring.jackson.default-property-inclusion=non_null
# Formatea las fechas (como las de las Citas) en texto ISO-8601 (ej. "2023-10-25") en lugar de milisegundos
spring.jackson.serialization.write-dates-as-timestamps=false